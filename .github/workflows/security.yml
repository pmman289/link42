name: Security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: 扫描明文凭据
        run: scripts/security/scan-secrets.sh
      - name: 审计前端依赖
        run: npm audit --prefix apps/web --audit-level=high
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: 检查 Shell 语法
        run: bash scripts/check-shell-syntax.sh
      - name: 后端测试
        run: |
          python -m pip install '.[dev]'
          python -m pytest -q
      - name: 前端测试与构建
        run: |
          npm ci --prefix apps/web
          npm test --prefix apps/web
          npm run build --prefix apps/web
